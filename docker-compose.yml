networks:
  prometheus-net:
    external: true
    name: prometheus-net

services:
  cadvisor:
    container_name: "${CONTAINER_NAME_PREFIX:-}cadvisor"
    image: gcr.io/cadvisor/cadvisor:v0.51.0
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks:
      - prometheus-net
    extends:
      file: docker-compose.base.yml
      service: base
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
